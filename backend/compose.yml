services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bubble
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD outside version control}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bubble-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bubble-postgres-data:
