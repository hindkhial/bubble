spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: Bubble
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 2000
      initialization-fail-timeout: 5000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      enabled: false
server:
  forward-headers-strategy: none
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: BUBBLE_SESSION
        path: /
        http-only: true
        secure: true
        same-site: lax
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
bubble:
  auth-limits:
    per-address-per-minute: ${BUBBLE_AUTH_PER_ADDRESS_PER_MINUTE:60}
    total-per-minute: ${BUBBLE_AUTH_TOTAL_PER_MINUTE:300}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  http:
    max-request-bytes: ${BUBBLE_MAX_REQUEST_BYTES:1048576}
