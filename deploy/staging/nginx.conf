worker_processes auto;
pid /tmp/nginx.pid;
# Request-level errors may contain private search URLs. Health checks report failures.
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No request URLs, query strings, credentials or private body logging.
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    server {
        listen 127.0.0.1:8081;
        location = /healthz { return 200 'UP'; }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control 'no-store' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        # Expo/RN web uses inline styles; no inline scripts are allowed.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded '';
            proxy_cache off;
            proxy_no_cache 1;
            proxy_read_timeout 30s;
        }
        # Missing assets must not return HTML; detail routes use the SPA fallback.
        location /_expo/ { try_files $uri =404; }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
